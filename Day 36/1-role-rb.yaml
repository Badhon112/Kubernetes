apiVersion: v1
kind: Namespace
metadata:
  name: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workload-editor
  namespace: dev
rules:
  # Rule 1 : Allow user to create and list pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "list"]

  # Rule 2 : Allow user to create and list Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bind-worker-role
  namespace: dev
subjects:
  # Subject 1: Individual user badhon
  - kind: User
    name: badhon
    apiGroup: rbac.authorization.k8s.io

  # Subject 2: Group of junior admins
  - kind: Group
    name: junior-admins
    apiGroup: rbac.authorization.k8s.io

roleRef:
  kind: Role
  name: workload-editor
  apiGroup: rbac.authorization.k8s.io
