apiVersion: v1
kind: Namespace
metadata:
  name: logging-ns

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-collector
  namespace: logging-ns
  labels:
    app: log-collector
spec:
  # replicas: 3
  selector:
    matchLabels:
      app: log-collector
  template:
    metadata:
      labels:
        app: log-collector
    spec:
      # tolerations:
      #   - key: node-role.kubernetes.io/control-plane
      #     operator: "Exists"
      #     effect: "NoSchedule"

      volumes:
        - name: empty-dir
          emptyDir: {}

      containers:
        - name: log-collector
          image: busybox
          command:
            [
              "/bin/sh",
              "-c",
              "while true; do echo Collecting logs...; sleep 30; done",
            ]
          resources:
            requests:
              cpu: "50m"
              memory: "60Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"
          volumeMounts:
            - name: empty-dir
              mountPath: /var/log
