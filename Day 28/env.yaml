apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      volumes:
        - name: frontend-volume
          emptyDir: {}
      containers:
        - name: frontend-container
          image: nginx
          resources:
            requests:
              cpu: "50m"
              memory: "100mi"
            limits:
              cpu: "70m"
              memory: "150mi"
          volumeMounts:
            - mountPath: /usr/share/nginx/html
              name: frontend-volume
          env:
            - name: app
              value: frontend
            - name: environment
              value: production
