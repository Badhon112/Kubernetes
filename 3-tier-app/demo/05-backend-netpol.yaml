apiVersion: networking.k8s.io/v1
kind: Networkpolicy
metadata:
  name: backend-policy
  namespace: app1-ns
spec:
  policyTypes:
    - Ingress
    - Egress
  podSelector:
    matchLabels:
      app: app1
      role: backend
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: app1
              role: frontend
      port:
        - protocol: TCP
          port: 5678
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: app1
              role: db
      port:
        - protocol: TCP 
          port: 3306
