apiVersion: apps/v1
kind: Deployment
metadata:
  name: android-deploy
  namespace: app1-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: android-page
  template:
    metadata:
      labels:
        app: android-page
    spec:
      containers:
        - name: python-http
          image: python:alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /android && echo '<html>
                <head><title>Android Users</title></head>
                <body>
                  <h1>Android Users</h1>
                  <p>I AM BADHON BISWAS</p>
                </body>
              </html>' > /android/index.html && cd / && python3 -m http.server 5678
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: "50m"
              memory: "60Mi"
            limits:
              cpu: "100m"
              memory: "100Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: android-svc
  namespace: app1-ns
spec:
  selector:
    app: android-page
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
